apiVersion: v1
kind: Pod
metadata:
  name: reto-root-en-k8s
  labels:
    reto: "docker-03"
spec:
  containers:
    - name: app
      image: reto-root:v1.0
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8080
      # 🛡️ Política de seguridad estricta: No permite contenedores como root
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
