services:
  # 📦 Registro OCI Local (Compatible con Docker Distribution Registry v2)
  registry:
    image: registry:2
    container_name: registro-local
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_SECRET: "secreto-registro-local-cnm"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: "['*']"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: "['HEAD', 'GET', 'OPTIONS', 'DELETE']"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: "['Authorization', 'Accept', 'Cache-Control']"
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: "['Docker-Content-Digest']"
    volumes:
      - datos-registro:/var/lib/registry
    networks:
      - red-registro

  # 🌐 Interfaz Gráfica Web para explorar repositorios y tags
  registry-ui:
    image: joxit/docker-registry-ui:2
    container_name: registro-ui
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Registro Local Cloud Native Medellín
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      - NGINX_PROXY_PASS_URL=http://registry:5000
    depends_on:
      - registry
    networks:
      - red-registro

volumes:
  datos-registro:
    name: datos-registro-local

networks:
  red-registro:
    name: red-registro-local
