---
extends: default

# Excluir intencionalmente los retos rotos, ya que contienen errores a propósito
# para que las personas y estudiantes del laboratorio los investiguen y corrijan.
ignore:
  - "*reto-roto*"
  - "*reto-roto*/**"
  - "**/reto-roto/**"
  - "**/*reto-roto*/**"
  - "**/2.reto-roto/**"
  - ".github/workflows/**"

rules:
  line-length: disable
  document-start: disable
  truthy: disable
  comments: disable
  comments-indentation: disable
  empty-lines: disable
  trailing-spaces: disable
  new-line-at-end-of-file: disable
