name: 🎉 Bienvenida a Nuevos Aportes

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    name: Saludar al contribuyente
    runs-on: ubuntu-24.04
    steps:
      - name: Publicar comentario de bienvenida
        uses: actions/github-script@v9
        with:
          script: |
            const user = context.payload.pull_request.user.login;
            const comment = `### 🎉 ¡Hola @${user}! Gracias por tu aporte a Cloud Native Medellín 🏔️☕

            ¡Qué alegría tenerte aprendiendo en comunidad en este workshop de **De Cero a Capitán en Kubernetes**!

            📌 **Chequeo rápido de tu aporte:**
            - [ ] **¿Te agregaste a [ASISTENTES.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/ASISTENTES.md)?** ¡Oficialmente eres un **Grumete**! 🛟
            - [ ] **¿Resolviste un Reto Roto?** Asegúrate de que tu YAML corregido esté dentro de \`aportes-comunidad/soluciones-retos/${user}/semana-XX/\` sin modificar los archivos originales de la semana.
            - [ ] **¿Agregaste un Cheatsheet o apunte?** Estará disponible para todos tus compañeros en \`aportes-comunidad/cheatsheets/\`.

            Un facilitador o mentor de la comunidad revisará tu Pull Request en breve. ¡A romper cosas sin miedo y seguir aprendiendo! 🚀`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });
